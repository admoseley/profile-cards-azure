# Terraform checks for infra/.
#
# None of this contacts Azure: there are no credentials here and none are
# needed. `terraform init -backend=false` skips the remote state backend, so
# every step is a static analysis of the configuration. `terraform plan` is
# deliberately absent — it would require Azure credentials in CI, and applying
# is owner-run by design.
name: Infra CI

on:
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra-ci.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: infra

jobs:
  terraform:
    name: Terraform fmt / validate / tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform init (no backend)
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0

      - name: tflint
        run: |
          tflint --init
          tflint --format compact

  checkov:
    name: Checkov (enforcing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # soft_fail is false: a finding fails the build. Deliberate exceptions are
      # suppressed inline in the Terraform with a one-line reason, never by
      # disabling a check globally or letting the job pass on findings.
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          framework: terraform
          soft_fail: false
          quiet: true
          output_format: cli
