# CI for the profile-cards site.
#
# Jobs are deliberately separate so a red check points straight at the layer
# that broke rather than at one monolithic "CI failed".
#
# The renderer job deliberately does NOT render a real card: that needs a token
# with private-repo access, and spending API calls (and exposing the secret) on
# every PR buys little. Real rendering is proven by the verify-token workflow
# and by the deploy pipeline itself.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not just the diff. A secret that was committed and
          # then removed in a later commit is still in the history and still
          # leaked — scanning only the PR diff would miss exactly that case.
          fetch-depth: 0

      # The open-source CLI is used directly rather than gitleaks/gitleaks-action:
      # the action wrapper requires a paid licence for private repos, so running
      # the CLI keeps this workflow copy-pastable to Adrian's private repos
      # unchanged. Version is pinned so a new release cannot change CI behaviour
      # underneath us.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan full history
        run: gitleaks detect --source . --redact --verbose --exit-code 1

  renderers:
    name: Renderers (install + syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` fails if package.json and package-lock.json disagree, which
      # also makes this a lockfile-drift check.
      - run: npm ci

      - name: Syntax-check renderer modules
        run: |
          set -euo pipefail
          find renderers -name '*.mjs' -print0 | xargs -0 -n1 node --check
          echo "All renderer modules parsed."

      # The card must never name a private repository. This asserts the
      # anonymisation path exists rather than trusting that a future edit keeps
      # it — the card is published publicly, so a regression here leaks the
      # names of unreleased projects.
      - name: Assert private-repo anonymisation is present
        run: |
          set -euo pipefail
          grep -q 'Private repository' renderers/top-repos.mjs
          echo "Anonymisation label present."
